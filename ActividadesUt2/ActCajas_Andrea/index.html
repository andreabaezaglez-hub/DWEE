<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad Cajas</title>
    <style>
        .cajaS {
            background-color: lightblue;
            width: 50px;
            height: 50px;
            cursor: grab;
        }

        .cajaM {
            background-color: lightseagreen;
            height: 100px;
            width: 100px;
            cursor: grab;
        }

        .cajaL {
            background-color: lightcoral;
            height: 150px;
            width: 150px;
            cursor: grab;
        }
    </style>
</head>

<body>

    <div class="cajaS" draggable="true"></div>
    <div class="cajaM" draggable="true"></div>
    <div class="cajaL" draggable="true"></div>

    <script src="actCajas.js"></script>
</body>

</html>
