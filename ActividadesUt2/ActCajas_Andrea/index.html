<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad Cajas</title>
    <style>
        .cajaS {
            background-color: lightblue;
            width: 50px;
            height: 50px;
            cursor: grab;
        }

        .cajaM {
            background-color: lightseagreen;
            height: 100px;
            width: 100px;
            cursor: grab;
        }

        .cajaL {
            background-color: lightcoral;
            height: 150px;
            width: 150px;
        }

        .main{
            /* No entiendo por qué solo me deja dropear las cajas en la derecha si se supone que esto pilla el 100%*/
            margin: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body class="main">

        <div class="cajaS" draggable="true"></div>
        <div class="cajaM" draggable="true"></div>
        <div class="cajaL"></div>
   

    <script src="actCajas.js"></script>
</body>

</html>
